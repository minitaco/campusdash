workflows:
  ios-unsigned:
    name: iOS Unsigned Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
        
      - name: Disable Swift Package Manager
        script: flutter config --no-enable-swift-package-manager
        
      # --- NEW STEP ADDED HERE ---
      - name: Create Export Options
        script: |
          echo '<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>' > /Users/builder/export_options.plist
      # ----------------------------
      
      - name: Build iOS (No Codesign)
        script: |
          # 1. Build the archive
          flutter build ipa --release --no-codesign
          
          # 2. Force xcode-project to package the archive into an IPA
          xcode-project build-ipa --workspace ios/Runner.xcworkspace --archive-directory build/ios/archive --export-options-plist /Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa